[browser]
gatherUsageStats = false

# Tông tím - vàng gold. Có cả giao diện sáng và tối; ứng dụng mặc định mở giao diện SÁNG (không theo cài đặt
# của máy) và người dùng tự chọn ở mục "Cài đặt" cuối thanh bên.
[theme]
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 700, 600, 600]
metricValueFontWeight = 700
baseRadius = "0.8rem"
buttonRadius = "full"
showSidebarBorder = false

[theme.light]
primaryColor = "#6d3fd9"
backgroundColor = "#fdfcff"
secondaryBackgroundColor = "#f4f0fd"
textColor = "#1f1937"
borderColor = "#e7e0f6"
linkColor = "#6d3fd9"
blueColor = "#6d3fd9"
violetColor = "#6d3fd9"
chartCategoricalColors = ["#6d3fd9", "#f2b100", "#1a9e8f", "#2f6fd6", "#c2336b"]

[theme.light.sidebar]
backgroundColor = "#f6f2ff"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#8a66f2"
backgroundColor = "#120f1d"
secondaryBackgroundColor = "#1f1933"
textColor = "#ece8f7"
borderColor = "#2f2848"
linkColor = "#b9a2ff"
blueColor = "#8a66f2"
violetColor = "#8a66f2"
chartCategoricalColors = ["#8a66f2", "#bb8b12", "#22a895", "#4f7fe0", "#d6588a"]

[theme.dark.sidebar]
backgroundColor = "#17132a"
secondaryBackgroundColor = "#1f1933"
